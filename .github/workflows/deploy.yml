# Deploys everything on every push to main:
#   1. database migrations -> Supabase
#   2. Supabase auth settings (site URL, redirect URLs, Google sign-in)
#   3. build + deploy -> Cloudflare Workers at pokertable.realizeaisolution.com
# Required repository secrets are listed in docs/DEPLOY.md.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_URL: https://pokertable.realizeaisolution.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Database migrations
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Supabase auth settings + public keys
        id: supa
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          api=https://api.supabase.com/v1/projects/$REF
          body=$(jq -n \
            --arg site "$APP_URL" \
            --arg allow "$APP_URL/**,http://localhost:3000/**" \
            --arg gid "$GOOGLE_CLIENT_ID" --arg gsecret "$GOOGLE_CLIENT_SECRET" \
            '{site_url: $site, uri_allow_list: $allow, external_google_enabled: ($gid != ""), external_google_client_id: $gid, external_google_secret: $gsecret}')
          curl -fsS -X PATCH "$api/config/auth" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$body" > /dev/null
          anon=$(curl -fsS "$api/api-keys" -H "Authorization: Bearer $TOKEN" | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "::add-mask::$anon"
          echo "url=https://$REF.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon=$anon" >> "$GITHUB_OUTPUT"

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon }}
          NEXT_PUBLIC_APK_URL: ${{ vars.APK_URL }}

      - name: Deploy to Cloudflare
        # NEXT_PUBLIC_* values are baked in at build time; runtime-only values are Worker secrets
        run: |
          npx opennextjs-cloudflare deploy
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1"; fi; }
          put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put ANDROID_CERT_SHA256 "$ANDROID_CERT_SHA256"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS "$APP_URL/api/version"
